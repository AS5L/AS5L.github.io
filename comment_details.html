<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <script src="https://cdn.bootcdn.net/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <title>评论详情</title>
    <style>
        :root {
            --md-primary: #006874; --md-surface: #fbfdfd; --md-on-surface: #191c1d;
            --md-surface-variant: #dbe4e6; --md-on-surface-variant: #3f484a;
            --md-radius-lg: 12px; --md-elevation-1: 0 1px 3px rgba(0,0,0,0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background: var(--md-surface); color: var(--md-on-surface); }

        .app-bar { background: var(--md-surface); padding: 16px; display: flex; align-items: center; gap: 16px; box-shadow: var(--md-elevation-1); position: sticky; top: 0; z-index: 100; }
        .back-btn { background: none; border: none; font-size: 24px; color: var(--md-on-surface); cursor: pointer; padding: 4px; border-radius: 50%;}
        .app-bar h1 { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;}

        .content { padding: 16px; max-width: 800px; margin: 0 auto; }

        .root-comment { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 4px solid var(--md-surface-variant); }
        .root-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .root-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--md-surface-variant); }
        .root-name { font-size: 15px; font-weight: 600; color: var(--md-on-surface); }
        
        .comment-stats { font-size: 13px; color: var(--md-on-surface-variant); margin: 8px 0; display: flex; gap: 16px; align-items: center; }
        .stat-item { display: inline-flex; align-items: center; gap: 4px; }
        .icon { width: 16px; height: 16px; fill: currentColor; }
        
        .root-text { font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin-bottom: 12px; }
        
        .like-section { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--md-on-surface-variant); }
        
        .sub-replies-title { font-size: 14px; font-weight: 600; color: var(--md-on-surface-variant); margin-bottom: 16px; }
        .comments-list { display: flex; flex-direction: column; gap: 16px; }
        
        .comment-item { display: flex; gap: 12px; }
        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--md-surface-variant); flex-shrink: 0; }
        .comment-content { flex: 1; border-bottom: 1px solid var(--md-surface-variant); padding-bottom: 16px; }
        .comment-item:last-child .comment-content { border-bottom: none; }
        
        .comment-name { font-size: 13px; color: var(--md-on-surface-variant); font-weight: 500; }
        .comment-text { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: var(--md-on-surface); }

        .load-sentinel { text-align: center; padding: 20px 0; font-size: 13px; color: var(--md-on-surface-variant); }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--md-on-surface-variant); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .bili-emote { height: 1.5em; width: auto; vertical-align: -0.3em; margin: 0 2px; display: inline-block; }
    </style>
</head>
<body>

    <header class="app-bar">
        <button class="back-btn" id="backBtn">←</button>
        <h1>评论详情</h1>
    </header>

    <div class="content">
        <div class="root-comment" id="rootCommentBox">
            <div style="text-align:center; padding: 20px; color: var(--md-on-surface-variant);">正在加载主评论...</div>
        </div>

        <div class="sub-replies-title" id="replyCountTitle">相关回复</div>
        <div class="comments-list" id="commentsList"></div>
        <div class="load-sentinel" id="loadSentinel">
            <span class="spinner"></span>正在加载更多回复...
        </div>
    </div>

<script>
const svgLike = `<svg class="icon" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;

const urlParams = new URLSearchParams(window.location.search);
const oid = urlParams.get('oid');
const root = urlParams.get('root');
const bvid = urlParams.get('bvid');

document.getElementById('backBtn').onclick = () => {
    if (bvid) window.location.href = `video.html?bvid=${bvid}`;
    else if (document.referrer) history.back();
    else window.location.href = 'home.html';
};

// ========================
// 图片适配与表情包解析
// ========================
function escapeHtml(unsafe) {
    return (unsafe || '').toString()
         .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function getImageFormat(baseSize) {
    const dpr = window.devicePixelRatio || 1;
    const targetPx = Math.round(baseSize * dpr);
    return `@${targetPx}w_${targetPx}h_1c.webp`;
}

function parseEmote(message, emoteDict) {
    let safeMsg = escapeHtml(message);
    if (!emoteDict) return safeMsg;
    
    // 详情页文本偏大，基础计算尺寸取 24
    const imageSuffix = getImageFormat(24); 

    for (const key in emoteDict) {
        const emote = emoteDict[key];
        const escapedKey = key.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
        const regex = new RegExp(escapedKey, 'g');
        const imgUrl = emote.url.replace(/^http:/, 'https:') + imageSuffix;
        safeMsg = safeMsg.replace(regex, `<img src="${imgUrl}" class="bili-emote" alt="${key}" loading="lazy">`);
    }
    return safeMsg;
}

function gmFetch(url, options = {}) {
    return new Promise((resolve, reject) => {
        const requestId = 'req_' + Math.random().toString(36).substr(2, 9);
        const listener = (event) => {
            if (event.source !== window) return;
            if (event.data && event.data.requestId === requestId) {
                if (event.data.type === 'GM_PROXY_RESPONSE') {
                    window.removeEventListener('message', listener);
                    const res = event.data.response;
                    if (event.data.eventType === 'onload') {
                        if (res.status >= 200 && res.status < 300) resolve(res.response);
                        else reject(new Error(`HTTP 状态异常: ${res.status}`));
                    } else reject(new Error('网络请求阻断'));
                }
            }
        };
        window.addEventListener('message', listener);
        const requestHeaders = { 'User-Agent': 'Mozilla/5.0 BiliDroid/91.78.13', 'Referer': 'https://www.bilibili.com/' };
        if (options.headers) { for (let key in options.headers) requestHeaders[key] = options.headers[key]; }
        window.postMessage({ type: 'GM_PROXY_REQUEST', requestId: requestId, url: url, method: options.method || 'GET', headers: requestHeaders, responseType: options.responseType || 'json', onload: true, onerror: true, ontimeout: true }, '*');
    });
}

let pn = 1;
let isEnd = false;
let isLoading = false;

function renderRootComment(rootData) {
    // 根评论头像 CSS 指定为 48px
    const avatarFormat = getImageFormat(48);
    const avatar = rootData.member.avatar.replace(/^http:/, 'https:') + avatarFormat;
    const parsedMessage = parseEmote(rootData.content.message, rootData.content.emote);
    
    document.getElementById('rootCommentBox').innerHTML = `
        <div class="root-header">
            <img class="root-avatar" src="${avatar}">
            <div class="root-name">${rootData.member.uname}</div>
        </div>
        <div class="root-text">${parsedMessage}</div>
        <div class="like-section">
            ${svgLike}
            <span>${rootData.like > 0 ? rootData.like : '赞'}</span>
            <span style="margin-left: 8px;">${new Date(rootData.ctime * 1000).toLocaleString('zh-CN', {hour12: false})}</span>
        </div>
    `;
    if (rootData.rcount !== undefined) {
        document.getElementById('replyCountTitle').innerText = `全部回复 (${rootData.rcount})`;
    }
}

async function loadSubComments() {
    if (isLoading || isEnd) return;
    if (!oid || !root) {
        document.getElementById('rootCommentBox').innerHTML = '参数缺失';
        return;
    }

    const container = document.getElementById('commentsList');
    const sentinel = document.getElementById('loadSentinel');
    isLoading = true;

    try {
        const params = { oid, type: 1, root, pn, ps: 20, sort: 0 };
        const query = new URLSearchParams();
        Object.keys(params).forEach(key => query.append(key, params[key]));
        
        const res = await gmFetch(`https://api.bilibili.com/x/v2/reply/reply?${query.toString()}`);
        if (res.code !== 0) throw new Error(res.message);
        
        if (pn === 1 && res.data.root) {
            renderRootComment(res.data.root);
        }

        const replies = res.data.replies || [];
        
        if (replies.length === 0) {
            isEnd = true;
            if (pn === 1) container.innerHTML = '<div style="color:var(--md-on-surface-variant); font-size:14px; text-align:center; padding: 10px;">暂无回复</div>';
        } else {
            replies.forEach(reply => {
                // 子回复头像 CSS 指定为 36px
                const avatarFormat = getImageFormat(36);
                const avatar = reply.member.avatar.replace(/^http:/, 'https:') + avatarFormat;
                const parsedMessage = parseEmote(reply.content.message, reply.content.emote);
                
                const el = document.createElement('div');
                el.className = 'comment-item';

                el.innerHTML = `
                    <img class="comment-avatar" src="${avatar}" loading="lazy">
                    <div class="comment-content">
                        <div class="comment-name">${reply.member.uname}</div>
                        <div class="comment-text">${parsedMessage}</div>
                        <div class="like-section">
                            ${svgLike}
                            <span>${reply.like > 0 ? reply.like : '赞'}</span>
                            <span style="margin-left: 8px;">${new Date(reply.ctime * 1000).toLocaleString('zh-CN', {hour12: false})}</span>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
            
            pn++;
            if (res.data.page && pn > Math.ceil(res.data.page.count / res.data.page.size)) {
                isEnd = true;
            }
        }

        if (isEnd) {
            sentinel.innerHTML = '没有更多回复了';
            sentinel.querySelector('.spinner')?.remove();
        }

    } catch (e) {
        sentinel.innerHTML = `加载失败: ${e.message}`;
    } finally {
        isLoading = false;
    }
}

const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
        loadSubComments();
    }
}, { rootMargin: '100px' });

observer.observe(document.getElementById('loadSentinel'));

loadSubComments();

</script>
</body>
</html>
