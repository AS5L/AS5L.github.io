<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <script src="https://cdn.bootcdn.net/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <title>播放详情页</title>
    <style>
        :root {
            --md-primary: #006874; --md-surface: #fbfdfd; --md-on-surface: #191c1d;
            --md-surface-variant: #dbe4e6; --md-on-surface-variant: #3f484a;
            --md-radius-lg: 12px; --md-elevation-1: 0 1px 3px rgba(0,0,0,0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: system-ui, sans-serif; 
            background: var(--md-surface); 
            color: var(--md-on-surface); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        .app-bar { flex-shrink: 0; background: var(--md-surface); padding: 16px; display: flex; align-items: center; gap: 16px; position: relative; z-index: 100; }
        .back-btn { background: none; border: none; font-size: 24px; color: var(--md-on-surface); cursor: pointer; padding: 4px; border-radius: 50%; }
        .app-bar h1 { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;}

        .player-wrapper { flex-shrink: 0; width: 100%; position: relative; background: #000; aspect-ratio: 16/9; z-index: 50; overflow: hidden; }
        video { width: 100%; height: 100%; outline: none; }
        audio { display: none; }
        .status-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white; background: rgba(0,0,0,0.7); font-size: 14px; pointer-events: none; z-index: 30; transition: opacity 0.3s; }

        .tabs { flex-shrink: 0; display: flex; border-bottom: 1px solid var(--md-surface-variant); background: var(--md-surface); z-index: 40; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; font-size: 15px; font-weight: 500; color: var(--md-on-surface-variant); cursor: pointer; position: relative; transition: color 0.2s; }
        .tab-item.active { color: var(--md-primary); }
        .tab-item.active::after { content: ''; position: absolute; bottom: -1px; left: 30%; right: 30%; height: 3px; background: var(--md-primary); border-radius: 3px 3px 0 0; }
        
        .main-scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; background: var(--md-surface); }

        .video-info-box { padding: 16px 16px 8px 16px; }
        .title { font-size: 18px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
        .author { font-size: 14px; color: var(--md-on-surface-variant); display: flex; justify-content: space-between; }
        .quality-badge { background: var(--md-primary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }

        .slider-viewport { overflow: hidden; width: 100%; touch-action: pan-y; }
        .slider-track { display: flex; width: 200%; transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); align-items: flex-start; }
        .slider-pane { width: 50%; flex-shrink: 0; padding: 0 16px 16px 16px; }

        .related-list { display: flex; flex-direction: column; gap: 12px; }
        .related-item { display: flex; gap: 12px; text-decoration: none; color: inherit; background: var(--md-surface-variant); border-radius: var(--md-radius-lg); padding: 8px; }
        .related-cover { width: 120px; aspect-ratio: 16/10; border-radius: 8px; object-fit: cover; }
        .related-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-top: 4px; padding-bottom: 4px; }
        .related-title { font-size: 13px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .related-up { font-size: 12px; color: var(--md-on-surface-variant); }

        .comments-container { padding-top: 16px; margin-bottom: 32px; }
        .comments-list { display: flex; flex-direction: column; gap: 16px; }
        .comment-item { display: flex; gap: 12px; }
        .comment-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--md-surface-variant); flex-shrink: 0; }
        .comment-content { flex: 1; border-bottom: 1px solid var(--md-surface-variant); padding-bottom: 16px; }
        .comment-item:last-child .comment-content { border-bottom: none; }
        .comment-name { font-size: 13px; color: var(--md-on-surface-variant); font-weight: 500; }
        .comment-stats { font-size: 13px; color: var(--md-on-surface-variant); margin: 4px 0 6px 0; display: flex; gap: 16px; align-items: center; }
        .stat-item { display: inline-flex; align-items: center; gap: 4px; }
        .icon { width: 16px; height: 16px; fill: currentColor; }
        .comment-text { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: var(--md-on-surface); }
        
        .sub-replies-box { background: var(--md-surface-variant); border-radius: 8px; padding: 10px 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .sub-reply-item { font-size: 13px; line-height: 1.5; color: var(--md-on-surface); word-break: break-all; }
        .sub-reply-name { color: var(--md-primary); font-weight: 500; margin-right: 6px; }
        .more-replies-btn { font-size: 12px; color: var(--md-primary); font-weight: 500; margin-top: 4px; text-decoration: none; display: inline-block; }

        .load-sentinel { text-align: center; padding: 20px 0; font-size: 13px; color: var(--md-on-surface-variant); }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--md-on-surface-variant); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ripple-target { position: relative; overflow: hidden; }
        .ripple { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple-anim 500ms linear; background-color: rgba(0, 0, 0, 0.3); pointer-events: none; }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        .bili-emote { height: 1.5em; width: auto; vertical-align: -0.3em; margin: 0 2px; display: inline-block; }
    </style>
</head>
<body>

    <header class="app-bar">
        <button class="back-btn ripple-target" onclick="window.location.href = 'home.html';">←</button>
        <h1 id="topBarTitle">加载中...</h1>
    </header>

    <div class="player-wrapper" id="playerWrapper">
        <div class="status-overlay" id="statusOverlay">建立流媒体通道中...</div>
        <video id="mainVideo" controls playsinline></video>
        <audio id="syncAudio"></audio>
    </div>
    
    <div class="tabs">
        <div class="tab-item active ripple-target" onclick="switchTab(0)">相关推荐</div>
        <div class="tab-item ripple-target" onclick="switchTab(1)">评论区</div>
    </div>

    <div class="main-scroll-area" id="mainScroll">
        <div class="slider-viewport">
            <div class="slider-track" id="sliderTrack">
                <div class="slider-pane" style="height: auto; visibility: visible;">
                    <div class="video-info-box">
                        <div class="title" id="videoTitle">正在解析视频信息...</div>
                        <div class="author">
                            <span id="videoAuthor">--</span>
                            <span id="videoQuality" class="quality-badge" style="display:none;"></span>
                        </div>
                    </div>
                    <div class="related-list" id="relatedList"></div>
                </div>
                
                <div class="slider-pane" style="height: 0px; visibility: hidden;">
                    <div class="comments-container">
                        <div class="comments-list" id="commentsList"></div>
                        <div class="load-sentinel" id="loadSentinel">
                            <span class="spinner"></span>正在加载评论...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
const log = (msg, type = 'log') => console[type === 'error' ? 'error' : type === 'warn' ? 'warn' : 'log'](`[BiliMSE] ${msg}`);

const svgLike = `<svg class="icon" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;

// ========================
// 文本安全、表情包与头像加载
// ========================
function escapeHtml(unsafe) {
    return (unsafe || '').toString()
         .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function getImageFormat(baseSize) {
    const dpr = window.devicePixelRatio || 1;
    const targetPx = Math.round(baseSize * dpr);
    return `@${targetPx}w_${targetPx}h_1c.webp`;
}

function parseEmote(message, emoteDict) {
    let safeMsg = escapeHtml(message);
    if (!emoteDict) return safeMsg;
    
    // 表情包大约是 1.5 倍的 14px 字体大小，也就是 21px
    const imageSuffix = getImageFormat(21); 

    for (const key in emoteDict) {
        const emote = emoteDict[key];
        const escapedKey = key.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
        const regex = new RegExp(escapedKey, 'g');
        const imgUrl = emote.url.replace(/^http:/, 'https:') + imageSuffix;
        safeMsg = safeMsg.replace(regex, `<img src="${imgUrl}" class="bili-emote" alt="${key}" loading="lazy">`);
    }
    return safeMsg;
}

// ========================
// 水波纹与 Tab 切换逻辑
// ========================
function createRipple(event, button) {
    if (event.type === 'mousedown' && button.dataset.touchFired) return;
    if (event.type === 'touchstart') {
        button.dataset.touchFired = 'true';
        setTimeout(() => { button.dataset.touchFired = 'false'; }, 500);
    }
    const circle = document.createElement("span");
    const diameter = Math.max(button.clientWidth, button.clientHeight);
    const radius = diameter / 2;
    const rect = button.getBoundingClientRect();
    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${clientX - rect.left - radius}px`;
    circle.style.top = `${clientY - rect.top - radius}px`;
    circle.classList.add("ripple");
    const existing = button.querySelector('.ripple');
    if (existing) existing.remove();
    button.appendChild(circle);
}

function bindRipple(el) {
    el.addEventListener('mousedown', function(e) { createRipple(e, el); });
    el.addEventListener('touchstart', function(e) { createRipple(e, el); }, {passive: true});
}
document.querySelectorAll('.ripple-target').forEach(bindRipple);

let currentTabIndex = 0;
function switchTab(index) {
    const isTabChange = currentTabIndex !== index;
    currentTabIndex = index;
    document.querySelectorAll('.tab-item').forEach((el, i) => el.classList.toggle('active', i === index));
    const track = document.getElementById('sliderTrack');
    track.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
    track.style.transform = `translateX(-${index * 50}%)`;
    const panes = document.querySelectorAll('.slider-pane');
    panes.forEach(p => { p.style.height = 'auto'; p.style.visibility = 'visible'; });
    
    if (isTabChange) document.getElementById('mainScroll').scrollTop = 0;

    setTimeout(() => {
        panes.forEach((p, i) => {
            if (i !== currentTabIndex) { p.style.height = '0px'; p.style.visibility = 'hidden'; }
        });
    }, 300);
}

const track = document.getElementById('sliderTrack');
let startX = 0, startY = 0, currentX = 0;
let isDragging = false, isScrolling = null;

track.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    isDragging = true; isScrolling = null; 
    track.style.transition = 'none'; 
}, { passive: true });

track.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    let deltaX = e.touches[0].clientX - startX, deltaY = e.touches[0].clientY - startY;
    if (isScrolling === null) isScrolling = Math.abs(deltaY) > Math.abs(deltaX);
    if (isScrolling) { isDragging = false; return; }
    if (e.cancelable) e.preventDefault();
    currentX = deltaX;
    document.querySelectorAll('.slider-pane').forEach(p => { p.style.height = 'auto'; p.style.visibility = 'visible'; });
    let percentMove = (currentX / window.innerWidth) * 50; 
    let baseTranslate = currentTabIndex === 0 ? 0 : -50;
    let translateX = baseTranslate + percentMove;
    if (translateX > 0) translateX *= 0.3;
    if (translateX < -50) translateX = -50 + ((translateX + 50) * 0.3);
    track.style.transform = `translateX(${translateX}%)`;
}, { passive: false }); 

track.addEventListener('touchend', (e) => {
    if (!isDragging) return;
    isDragging = false;
    if (currentX === 0) return;
    const swipeThreshold = window.innerWidth * 0.35; 
    if (currentX < -swipeThreshold && currentTabIndex === 0) switchTab(1);
    else if (currentX > swipeThreshold && currentTabIndex === 1) switchTab(0);
    else switchTab(currentTabIndex); 
    currentX = 0;
});

// ========================
// 网络与数据处理模块
// ========================
function gmFetch(url, options = {}) {
    return new Promise((resolve, reject) => {
        const requestId = 'req_' + Math.random().toString(36).substr(2, 9);
        const listener = (event) => {
            if (event.source !== window) return;
            if (event.data && event.data.requestId === requestId) {
                if (event.data.type === 'GM_PROXY_RESPONSE') {
                    window.removeEventListener('message', listener);
                    const res = event.data.response;
                    if (event.data.eventType === 'onload') {
                        if (res.status >= 200 && res.status < 300) resolve(res.response);
                        else reject(new Error(`HTTP 状态异常: ${res.status}`));
                    } else reject(new Error('网络请求阻断'));
                }
            }
        };
        window.addEventListener('message', listener);
        const requestHeaders = { 'User-Agent': 'Mozilla/5.0 BiliDroid/91.78.13', 'Referer': 'https://www.bilibili.com/' };
        if (options.headers) { for (let key in options.headers) requestHeaders[key] = options.headers[key]; }
        window.postMessage({ type: 'GM_PROXY_REQUEST', requestId: requestId, url: url, method: options.method || 'GET', headers: requestHeaders, responseType: options.responseType || 'json', onload: true, onerror: true, ontimeout: true }, '*');
    });
}

const mixinKeyEncTab = [46, 47, 18, 2, 53, 8, 23, 32, 15, 50, 10, 31, 58, 3, 45, 35, 27, 43, 5, 49, 33, 9, 42, 19, 29, 28, 14, 39, 12, 38, 41, 13, 37, 48, 7, 16, 24, 55, 40, 61, 26, 17, 0, 1, 60, 51, 30, 4, 22, 25, 54, 21, 56, 59, 6, 63, 57, 62, 11, 36, 20, 34, 44, 52];
function getMixinKey(orig) { return mixinKeyEncTab.map(n => orig[n]).join('').slice(0, 32); }
async function getWbiKeys() {
    const cached = localStorage.getItem('bili_wbi_keys');
    if (cached) {
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.ts < 24 * 60 * 60 * 1000) return parsed.keys;
    }
    const res = await gmFetch('https://api.bilibili.com/x/web-interface/nav');
    if (!res.data || !res.data.wbi_img) throw new Error('提取 wbi_img 失败');
    const keys = { imgKey: res.data.wbi_img.img_url.split('/').pop().split('.')[0], subKey: res.data.wbi_img.sub_url.split('/').pop().split('.')[0] };
    localStorage.setItem('bili_wbi_keys', JSON.stringify({ ts: Date.now(), keys }));
    return keys;
}
function encWbi(params, imgKey, subKey) {
    const mixinKey = getMixinKey(imgKey + subKey);
    params.wts = Math.round(Date.now() / 1000);
    const query = Object.keys(params).sort().map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k].toString().replace(/[!'()*]/g, ''))}`).join('&');
    return `${query}&w_rid=${md5(query + mixinKey)}`;
}

const UI = { overlay: document.getElementById('statusOverlay'), mainVideo: document.getElementById('mainVideo'), syncAudio: document.getElementById('syncAudio') };
const urlParams = new URLSearchParams(window.location.search);
const bvid = urlParams.get('bvid');
let currentAid = null; 

async function init() {
    if (!bvid) return document.getElementById('videoTitle').innerText = "错误：未提供 BVID 参数";
    try {
        const viewRes = await gmFetch(`https://api.bilibili.com/x/web-interface/view?bvid=${bvid}`);
        if (viewRes.code !== 0) throw new Error(viewRes.message);
        
        const { aid, cid, title, owner } = viewRes.data;
        currentAid = aid; 
        document.getElementById('topBarTitle').innerText = title;
        document.getElementById('videoTitle').innerText = title;
        document.getElementById('videoAuthor').innerText = `UP主: ${owner.name}`;
        
        loadRelated(bvid);
        setupIntersectionObserver();
        
        const keys = await getWbiKeys();
        const signedQuery = encWbi({ bvid, cid, qn: 120, fnval: 16, fnver: 0, fourk: 1, try_look: 1 }, keys.imgKey, keys.subKey);
        const playRes = await gmFetch(`https://api.bilibili.com/x/player/wbi/playurl?${signedQuery}`);
        if (playRes.code !== 0) throw new Error(playRes.message);
        
        const dash = playRes.data.dash;
        const bestVideo = dash.video[0];
        const bestAudio = dash.audio ? dash.audio[0] : null;
        
        const qualityIndex = playRes.data.accept_quality.indexOf(bestVideo.id);
        const qualityDesc = qualityIndex !== -1 ? playRes.data.accept_description[qualityIndex] : `${bestVideo.height}P`;
        document.getElementById('videoQuality').innerText = qualityDesc;
        document.getElementById('videoQuality').style.display = 'inline-block';

        const vUrl = (bestVideo.baseUrl || bestVideo.base_url).replace(/^http:/, 'https:');
        const vCodec = `video/mp4; codecs="${bestVideo.codecs}"`;
        const p = [attachStream(vUrl, UI.mainVideo, vCodec)];
        
        if (bestAudio) {
            const aUrl = (bestAudio.baseUrl || bestAudio.base_url).replace(/^http:/, 'https:');
            const aCodec = `audio/mp4; codecs="${bestAudio.codecs}"`;
            p.push(attachStream(aUrl, UI.syncAudio, aCodec));
        }
        await Promise.all(p);
        
        UI.mainVideo.onplay = () => UI.syncAudio.play();
        UI.mainVideo.onpause = () => UI.syncAudio.pause();
        UI.mainVideo.onseeked = () => { UI.syncAudio.currentTime = UI.mainVideo.currentTime; };
        UI.mainVideo.onratechange = () => { UI.syncAudio.playbackRate = UI.mainVideo.playbackRate; };
        UI.mainVideo.onwaiting = () => UI.syncAudio.pause();
        UI.mainVideo.onplaying = () => UI.syncAudio.play();
        
        // == 新增：实时检测音画同步机制 ==
        setInterval(() => {
            if (!UI.mainVideo.paused && !UI.syncAudio.paused && !UI.mainVideo.seeking) {
                const diff = Math.abs(UI.mainVideo.currentTime - UI.syncAudio.currentTime);
                // 如果误差超过 0.3 秒，强制将视频进度拉到音频进度
                if (diff > 0.3) {
                    log(`音画不同步矫正 (${diff.toFixed(2)}s)`);
                    UI.mainVideo.currentTime = UI.syncAudio.currentTime;
                }
            }
        }, 300);
        
        UI.overlay.style.opacity = '0';
        setTimeout(() => UI.overlay.style.display = 'none', 300);
        
        try { await UI.mainVideo.play(); } 
        catch(e) { UI.mainVideo.muted = true; await UI.mainVideo.play(); }

    } catch (e) {
        UI.overlay.innerText = "加载失败: " + e.message;
    }
}

async function loadRelated(targetBvid) {
    try {
        const res = await gmFetch(`https://api.bilibili.com/x/web-interface/archive/related?bvid=${targetBvid}`);
        if (res.code !== 0) return;
        const container = document.getElementById('relatedList');
        res.data.forEach(item => {
            const a = document.createElement('a');
            a.className = 'related-item ripple-target'; 
            a.href = `video.html?bvid=${item.bvid}`;
            const pic = item.pic.replace(/^http:/, 'https:') + '@320w_200h_1c.webp';
            a.innerHTML = `<img class="related-cover" src="${pic}" loading="lazy"><div class="related-info"><div class="related-title">${item.title}</div><div class="related-up">${item.owner.name}</div></div>`;
            bindRipple(a); 
            container.appendChild(a);
        });
    } catch (e) {}
}

let cmtPagination = { next: 0, isEnd: false, isLoading: false };

async function loadComments(aid, nextCursor = 0) {
    if (cmtPagination.isLoading || cmtPagination.isEnd) return;
    const container = document.getElementById('commentsList');
    const sentinel = document.getElementById('loadSentinel');
    cmtPagination.isLoading = true;
    
    try {
        const keys = await getWbiKeys();
        const params = { oid: aid, type: 1, mode: 3 };
        if (nextCursor > 0) params.next = nextCursor;
        
        const signedQuery = encWbi(params, keys.imgKey, keys.subKey);
        const res = await gmFetch(`https://api.bilibili.com/x/v2/reply/wbi/main?${signedQuery}`);
        if (res.code !== 0) throw new Error(res.message);
        
        const data = res.data;
        const replies = data.replies || [];
        cmtPagination.next = data.cursor.next;
        cmtPagination.isEnd = data.cursor.is_end || replies.length === 0;

        if (replies.length === 0 && nextCursor === 0) {
            container.innerHTML = '<div style="color:var(--md-on-surface-variant); font-size:14px; text-align:center; padding: 20px;">暂无评论</div>';
            sentinel.style.display = 'none';
            return;
        }

        replies.forEach(reply => {
            // CSS 中评论区头像是 40px，使用getImageFormat计算DPR适配
            const avatarFormat = getImageFormat(40);
            const avatar = reply.member.avatar.replace(/^http:/, 'https:') + avatarFormat;
            
            const parsedMainMsg = parseEmote(reply.content.message, reply.content.emote);
            
            let subRepliesHtml = '';
            if (reply.replies && reply.replies.length > 0) {
                let subItems = reply.replies.map(sub => {
                    const parsedSubMsg = parseEmote(sub.content.message, sub.content.emote);
                    return `<div class="sub-reply-item"><span class="sub-reply-name">${sub.member.uname}</span>: <span>${parsedSubMsg}</span></div>`;
                }).join('');
                
                let moreBtn = reply.rcount > reply.replies.length 
                    ? `<a class="more-replies-btn ripple-target" href="comment_details.html?oid=${aid}&root=${reply.rpid}&bvid=${bvid}" style="padding:4px">查看全部 ${reply.rcount} 条回复 ></a>` 
                    : '';
                    
                subRepliesHtml = `<div class="sub-replies-box">${subItems}${moreBtn}</div>`;
            } else if (reply.rcount > 0) {
                subRepliesHtml = `<a class="more-replies-btn ripple-target" href="comment_details.html?oid=${aid}&root=${reply.rpid}&bvid=${bvid}" style="margin-top:8px; padding:4px;">查看全部 ${reply.rcount} 条回复 ></a>`;
            }
            
            const el = document.createElement('div');
            el.className = 'comment-item';
            el.innerHTML = `
                <img class="comment-avatar" src="${avatar}" loading="lazy">
                <div class="comment-content">
                    <div class="comment-name">${reply.member.uname}</div>
                    <div class="comment-text">${parsedMainMsg}</div>
                    <div class="comment-stats">
                        <span class="stat-item">${svgLike} ${reply.like > 0 ? reply.like : '赞'}</span>
                        <span class="stat-item">${new Date(reply.ctime * 1000).toLocaleString('zh-CN', {hour12: false})}</span>
                    </div>
                    ${subRepliesHtml}
                </div>
            `;
            container.appendChild(el);
            const moreBtnEl = el.querySelector('.more-replies-btn');
            if(moreBtnEl) bindRipple(moreBtnEl);
        });

        if (cmtPagination.isEnd) {
            sentinel.innerHTML = '没有更多评论了';
            sentinel.querySelector('.spinner')?.remove();
        }

    } catch (e) { 
        if (nextCursor === 0) container.innerHTML = `<div style="color:red; font-size:14px;">评论加载失败: ${e.message}</div>`;
        sentinel.innerHTML = '加载失败，请重试';
    } finally {
        cmtPagination.isLoading = false;
    }
}

function setupIntersectionObserver() {
    const sentinel = document.getElementById('loadSentinel');
    const scrollArea = document.getElementById('mainScroll'); 
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !cmtPagination.isLoading && !cmtPagination.isEnd && currentAid) {
            loadComments(currentAid, cmtPagination.next);
        }
    }, { root: scrollArea, rootMargin: '100px' });
    observer.observe(sentinel);
}

function attachStream(url, mediaEl, mimeCodec) {
    return new Promise((resolve, reject) => {
        const ms = new MediaSource();
        mediaEl.src = URL.createObjectURL(ms);
        ms.addEventListener('sourceopen', async () => {
            URL.revokeObjectURL(mediaEl.src);
            const sourceBuffer = ms.addSourceBuffer(mimeCodec);
            const chunkSize = 2 * 1024 * 1024;
            let start = 0, retry = 0, isFirst = true;

            while (ms.readyState === 'open') {
                if (sourceBuffer.buffered.length > 0 && (sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1) - mediaEl.currentTime > 30)) {
                    await new Promise(r => setTimeout(r, 1000)); continue;
                }
                try {
                    const arrayBuffer = await gmFetch(url, { headers: { 'Range': `bytes=${start}-${start + chunkSize - 1}` }, responseType: 'arraybuffer' });
                    if (sourceBuffer.updating) await new Promise(r => sourceBuffer.addEventListener('updateend', r, {once: true}));
                    sourceBuffer.appendBuffer(arrayBuffer);
                    start += arrayBuffer.byteLength;
                    retry = 0;
                    await new Promise(r => { if(!sourceBuffer.updating) r(); else sourceBuffer.addEventListener('updateend', r, {once: true}); });
                    if (isFirst) { isFirst = false; resolve(); }
                    if (arrayBuffer.byteLength < chunkSize) { if(ms.readyState === 'open') ms.endOfStream(); break; }
                } catch (e) {
                    if (e.message.includes('416')) { if(ms.readyState === 'open') ms.endOfStream(); break; }
                    if (retry < 3) { retry++; await new Promise(r => setTimeout(r, 1000)); continue; }
                    if (isFirst) reject(e); break;
                }
            }
        });
    });
}

init();
